name: Build STNSF

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: iOS
            os: macos-latest
            target: iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine platform builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Upload STNSF
        uses: actions/upload-artifact@v4
        with:
          name: STNSF-Geode-Builds
          path: ${{ steps.combine.outputs.build-output }}
